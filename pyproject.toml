[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-studio"
version = "0.2.0"
description = "Desktop GUI and CLI studio with embedded X-AnyLabeling, MLLM review, and YOLO26 training."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4.0",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "opencv-contrib-python-headless>=4.7.0.72",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
    "numpy>=2.0.0",
    "google-genai>=2.30.1",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
yolo-studio-cli = "yolo_studio.cli:main"

[project.gui-scripts]
yolo-studio = "yolo_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
